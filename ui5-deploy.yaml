# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zsdtr2.zsdtr2
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DS2200_BAS
          url: http://tridentds2:44300
          client: '200'
        app:
          name: ZSDTR2
          description: Transport Manager
          package: ZDEV_UTILITY
          transport:  DS2K920131
        exclude:
          - /test/